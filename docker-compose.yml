version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharma_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharma_dw}
      POSTGRES_USER: ${POSTGRES_USER:-dw_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharma_secure_pass_2025}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dw_admin} -d ${POSTGRES_DB:-pharma_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
